# Render Blueprint: deploy from Dashboard > New > Blueprint
# This service runs Telegram long polling, not an HTTP web server.
services:
  - type: worker
    name: tennis-predictions-bot
    runtime: python
    region: frankfurt
    plan: starter
    repo: https://github.com/JOJOCUP1/tennis-predictions-bot
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: PACKAGE_STARS
        value: "0"
      - key: DB_PATH
        value: /opt/render/project/src/data/tennis.db
      - key: PYTHON_VERSION
        value: "3.12.7"
    disk:
      name: tennis-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
